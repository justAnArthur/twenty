# just-agents fork: builds the Twenty image (server + frontend) and pushes it
# to ghcr.io/justanarthur/twenty. Tag the just-agents branch as
# `ja/<upstream version>-ja.<n>`, e.g. `ja/v2.52.0-ja.1`; the image takes the
# part after `ja/`.
name: ja-publish

on:
  push:
    tags: ["ja/*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, e.g. v2.52.0-ja.1"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # two yarn installs (front and server), the frontend build and the gha
      # cache export together come close to the runner's ~20 GB of free disk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve image tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "tag=${INPUT_VERSION:-${GITHUB_REF_NAME#ja/}}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          # the Dockerfile's last stage is the all-in-one dev image
          target: twenty
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
          tags: ghcr.io/justanarthur/twenty:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
